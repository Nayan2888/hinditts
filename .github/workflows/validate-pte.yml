name: Validate PTE Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Host PTE validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ExecuTorch validation runtime
        run: python -m pip install --upgrade pip && python -m pip install --disable-pip-version-check torch==2.10.0 executorch==1.1.0 numpy soundfile

      - name: Create model directory
        run: mkdir -p .ci-models

      - name: Download conditioning PTE
        run: python -c "from urllib.request import urlretrieve; urlretrieve('https://huggingface.co/acul3/chatterbox-executorch/resolve/main/t3_cond_speech_emb.pte', '.ci-models/t3_cond_speech_emb.pte'); urlretrieve('https://huggingface.co/acul3/chatterbox-executorch/resolve/main/t3_cond_enc.pte', '.ci-models/t3_cond_enc.pte')"

      - name: Download runtime PTEs
        run: python -c "from urllib.request import urlretrieve; [urlretrieve('https://huggingface.co/acul3/chatterbox-executorch/resolve/main/'+n, '.ci-models/'+n) for n in ['t3_prefill.pte','t3_decode.pte','s3gen_encoder.pte','cfm_step.pte','hifigan.pte']]"

      - name: Download tokenizer
        run: python -c "from urllib.request import urlretrieve; urlretrieve('https://raw.githubusercontent.com/acul3/chatterbox-tts-android/main/app/src/main/assets/grapheme_mtl_merged_expanded_v1.json', 'app/src/main/assets/grapheme_mtl_merged_expanded_v1.json')"

      - name: Build cached conditioning embedding
        run: python scripts/build_cached_cond_emb.py .ci-models/t3_cond_speech_emb.pte .ci-models/t3_cond_enc.pte app/src/main/assets/cond_speech_tokens.bin app/src/main/assets/speaker_emb.bin app/src/main/assets/cached_cond_emb.bin

      - name: Run complete Hindi PTE validation
        run: python scripts/validate_android_pipeline.py

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: hinditts-pte-validation
          path: .ci-output
          retention-days: 14
