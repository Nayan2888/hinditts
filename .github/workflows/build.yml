name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download tokenizer asset
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 "https://huggingface.co/acul3/chatterbox-executorch/resolve/main/grapheme_mtl_merged_expanded_v1.json" -o app/src/main/assets/grapheme_mtl_merged_expanded_v1.json
          test -s app/src/main/assets/grapheme_mtl_merged_expanded_v1.json

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
