name: Diagnose conditioning PTE

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ExecuTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install executorch==1.1.0 numpy

      - name: Download conditioning PTE models
        run: |
          mkdir -p diag
          curl -L --fail --retry 3 "https://huggingface.co/acul3/chatterbox-executorch/resolve/main/t3_cond_speech_emb.pte" -o diag/t3_cond_speech_emb.pte
          curl -L --fail --retry 3 "https://huggingface.co/acul3/chatterbox-executorch/resolve/main/t3_cond_enc.pte" -o diag/t3_cond_enc.pte
          cp app/src/main/assets/cond_speech_tokens.bin diag/
          cp app/src/main/assets/speaker_emb.bin diag/
          cp app/src/main/assets/emotion_adv.bin diag/

      - name: Test conditioning with exact Android inputs
        run: |
          python - <<'PY'
          import numpy as np
          import torch
          from executorch.runtime import Runtime

          def load(name):
              return np.fromfile("diag/"+name, dtype=np.float32)

          tokens_i32 = np.fromfile("diag/cond_speech_tokens.bin", dtype=np.int32).reshape(1,150)
          spk = load("speaker_emb.bin").reshape(1,256)
          emo = load("emotion_adv.bin").reshape(1,1,1)

          rt = Runtime.get()
          prog = rt.load_program("diag/t3_cond_speech_emb.pte")
          method = prog.load_method("forward")

          def run_tokens(dtype_name, t):
              try:
                  out = method.execute([t])
                  y = out[0]
                  print(dtype_name, "SUCCESS", "shape=", tuple(y.shape), "dtype=", y.dtype)
                  np.asarray(y.numpy() if hasattr(y, "numpy") else y)
                  return out[0]
              except Exception as e:
                  print(dtype_name, "FAILED:", repr(e))
                  return None

          out64 = run_tokens("INT64", torch.from_numpy(tokens_i32.astype(np.int64)))
          out32 = run_tokens("INT32", torch.from_numpy(tokens_i32))

          if out64 is None:
              raise SystemExit("INT64 conditioning speech embedding failed in Python runtime; model/PTE needs further investigation.")

          cond_speech_emb = out64
          cond_prog = rt.load_program("diag/t3_cond_enc.pte")
          cond_method = cond_prog.load_method("forward")

          try:
              out = cond_method.execute([
                  torch.from_numpy(spk),
                  cond_speech_emb,
                  torch.from_numpy(emo),
              ])
              y = out[0]
              print("COND_ENC SUCCESS", "shape=", tuple(y.shape), "dtype=", y.dtype)
              arr = y.numpy() if hasattr(y, "numpy") else np.asarray(y)
              np.asarray(arr, dtype=np.float32).tofile("diag/cond_emb.bin")
          except Exception as e:
              print("COND_ENC FAILED:", repr(e))
              raise
          PY

      - name: Upload diagnostic result
        uses: actions/upload-artifact@v4
        with:
          name: cond-diagnostic
          path: |
            diag/cond_emb.bin
            diag/*.pte
          retention-days: 3
